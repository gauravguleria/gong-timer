name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Assemble web files into www/
        run: |
          rm -rf www && mkdir -p www
          cp index.html styles.css app.js icon.svg www/
          if [ -d sounds ]; then cp -r sounds www/; fi
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/app.js

      - name: Create Android project
        run: npx cap add android

      - name: Add native gong service (rings with screen off / app in background)
        run: |
          PKG_DIR=android/app/src/main/java/com/gauravguleria/gongtimer
          mkdir -p "$PKG_DIR" android/app/src/main/res/raw
          cp native/*.java "$PKG_DIR/"
          cp sounds/gong.mp3 android/app/src/main/res/raw/gong.mp3
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p).read()
          perms = ('    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
                   '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                   '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n'
                   '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n')
          m = m.replace('<application', perms + '    <application', 1)
          svc = '        <service android:name=".GongService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n'
          m = m.replace('</application>', svc + '    </application>', 1)
          open(p, 'w').write(m)
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Sync web files into the Android project
        run: npx cap sync android

      - name: Sign with the committed key and set versionCode
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|signingConfigs\|storeFile" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify the APK is signed with the committed key
        run: |
          WANT=$(keytool -list -v -keystore signing/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1)
          GOT=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | grep "SHA256:" | head -1)
          echo "want: $WANT"; echo "got:  $GOT"
          [ "$WANT" = "$GOT" ] || { echo "Signing key mismatch"; exit 1; }

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "gong-timer-$TAG.apk"
          gh release create "$TAG" "gong-timer-$TAG.apk" \
            --title "Gong Timer $TAG" \
            --notes "Built automatically from commit ${{ github.sha }}. Open this release on your Android phone and tap the APK to install or update."
